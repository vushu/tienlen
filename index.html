<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tiến Lên</title>
    <!-- Home-screen app support: the manifest echoes the #room-code so
         launching the app reconnects to the right room. -->
    <link rel="manifest" href="manifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
        // Service worker: instant PWA launches (cached app shell) with
        // background refresh. https (localhost is fine too).
        if ('serviceWorker' in navigator
            && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ecf0f1;
            background: radial-gradient(ellipse at top, #1d6f42 0%, #14532d 55%, #0c3a1e 100%);
            /* Notched devices: the page extends under the status bar;
               keep the content below it. --sat is set by the client
               (fixSafeArea) as a reliable fallback when env() lies
               (iOS standalone bug); 0px default = no notch. */
            padding-top: max(env(safe-area-inset-top), var(--sat, 0px), 8px);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }

        header {
            position: sticky;
            /* Stay below the iOS status bar when scrolled: the body's
               safe-area padding only covers the unscrolled position. */
            top: max(env(safe-area-inset-top), var(--sat, 0px));
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(6, 26, 15, 0.85);
            backdrop-filter: blur(4px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.12);
        }

        /* ---------- Header ---------- */

        header h1 {
            margin: 0;
            font-size: 1.4em;
            letter-spacing: 1px;
        }

        #my-name {
            padding: 2px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
            color: #ffd97a;
            font-size: 0.8em;
            font-weight: 600;
            cursor: pointer;
        }

        #my-name:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #player-turn {
            margin: 0;
            font-size: 1.1em;
            font-weight: 600;
        }

        #player-turn.your-turn {
            color: #7dffa8;
            text-shadow: 0 0 12px rgba(125, 255, 168, 0.55);
        }

        /* Spectator badge: shown in the header while watching (not
           seated). Blue pill to contrast with the amber pass badge. */
        .spectator-badge {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7fc8f8;
            background: rgba(127, 200, 248, 0.12);
            border: 1px solid rgba(127, 200, 248, 0.45);
            white-space: nowrap;
        }

        /* ---------- Connection status banner ---------- */

        .connection-status {
            position: fixed;
            top: max(env(safe-area-inset-top), var(--sat, 0px));
            left: 0;
            right: 0;
            z-index: 300;
            padding: 10px 20px;
            text-align: center;
            font-weight: 700;
            color: #fff;
            background: #c0392b;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }

        /* ---------- Table ---------- */

        #table {
            min-height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 24px auto 8px;
            padding: 20px;
            max-width: 900px;
            border-radius: 16px;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.07), rgba(0, 0, 0, 0.18));
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.35);
        }

        #cards-in-play-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .placed-by {
            width: 100%;
            text-align: center;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(236, 240, 241, 0.65);
        }

        /* ---------- Controls ---------- */

        #controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 24px;
            margin: 10px auto 26px;
            /* Match the hands container so the buttons align with the
               player hand boxes. */
            max-width: 1100px;
            padding: 0 16px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            padding: 6px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.25);
        }

        /* Utility row: New Game/Restart on the left, Sort on the right.
           The sort group pins right with margin-left: auto so it stays
           there even when the Start game group is hidden mid-game. */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        #sort-actions {
            margin-left: auto;
        }

        /* The main action group: Place and Pass are opposite, high-stakes
           actions - give them size, separation and distinct colors. */
        .btn-group.main-actions {
            gap: 24px;
            padding: 8px;
        }

        .btn-group.main-actions button {
            min-width: 130px;
            padding: 14px 24px;
            font-size: 1.1em;
        }

        #pass-btn:not(.primary) {
            background: rgba(120, 40, 40, 0.45);
            border-color: rgba(220, 90, 90, 0.5);
        }

        #pass-btn:not(.primary):hover {
            background: rgba(150, 50, 50, 0.6);
        }

        button {
            padding: 8px 16px;
            font-size: 0.95em;
            font-weight: 600;
            color: #ecf0f1;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        button:active {
            transform: scale(0.97);
        }

        button.primary {
            background: #1e8e4e;
            border-color: #27ae60;
        }

        button.primary:hover {
            background: #27ae60;
        }

        button.danger {
            background: rgba(180, 60, 60, 0.55);
            border-color: rgba(220, 90, 90, 0.7);
        }

        button.danger:hover {
            background: rgba(200, 70, 70, 0.75);
        }

        /* A disabled button reads as unavailable: grayed out, no
           pointer, no hover/active feedback. Must come after the
           .primary/.danger rules so it wins for those too. */
        button:disabled,
        button:disabled:hover,
        #pass-btn:disabled,
        #pass-btn:disabled:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
            color: rgba(236, 240, 241, 0.4);
            cursor: not-allowed;
            transform: none;
        }

        /* ---------- Hands ---------- */

        #hands-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px 40px;
        }

        .hand {
            margin: 14px 0;
            padding: 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.22);
        }

        .hand h3 {
            margin: 0 0 8px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(236, 240, 241, 0.75);
        }

        .hand.your-hand {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(125, 255, 168, 0.35);
        }

        .hand.your-hand h3 {
            color: #7dffa8;
        }

        .pass-toast.left-toast {
            color: #e74c3c;
            border-color: rgba(231, 76, 60, 0.6);
        }

        /* ---------- Grace countdown banner ---------- */

        .grace-countdown {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 250;
            padding: 10px 24px;
            border-radius: 999px;
            font-weight: 700;
            color: #f39c12;
            background: rgba(20, 12, 0, 0.85);
            border: 1px solid rgba(243, 156, 18, 0.6);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        /* ---------- Bomb animation ---------- */

        .bomb-animation {
            position: fixed;
            z-index: 250;
            font-size: 40px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: bomb-explode 1.4s ease-out forwards;
        }

        @keyframes bomb-explode {
            0% {
                font-size: 40px;
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3);
            }
            15% {
                font-size: 90px;
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            60% {
                font-size: 120px;
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                font-size: 140px;
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.4);
            }
        }

        .bomb-banner {
            position: fixed;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 250;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 1.4em;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            background: linear-gradient(135deg, #c0392b, #e67e22);
            border: 2px solid rgba(241, 196, 15, 0.8);
            box-shadow: 0 6px 24px rgba(192, 57, 43, 0.6);
            pointer-events: none;
            animation: bomb-banner 2.4s ease forwards;
        }

        @keyframes bomb-banner {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px) scale(0.9);
            }
            12% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
        }

        .pass-toast.joined-toast {
            color: #3498db;
            border-color: rgba(52, 152, 219, 0.6);
        }

        /* ---------- Seat offer dialog ---------- */

        .seat-offer {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
        }

        .seat-offer-box {
            padding: 24px 28px;
            border-radius: 14px;
            text-align: center;
            background: #14532d;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .seat-offer-box p {
            margin: 0 0 6px;
            font-size: 1.1em;
            font-weight: 600;
        }

        .seat-offer-note {
            font-size: 0.85em !important;
            font-weight: 400 !important;
            color: rgba(236, 240, 241, 0.7);
        }

        .seat-offer-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 16px;
        }

        .pass-badge.left-badge {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.15);
            border-color: rgba(231, 76, 60, 0.5);
        }

        .pass-badge {
            padding: 1px 8px;
            border-radius: 999px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f39c12;
            background: rgba(243, 156, 18, 0.15);
            border: 1px solid rgba(243, 156, 18, 0.5);
        }

        /* ---------- Pass toast animation ---------- */

        .pass-toast {
            position: fixed;
            left: 50%;
            bottom: 30%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: 999px;
            font-size: 1.1em;
            font-weight: 700;
            color: #f39c12;
            background: rgba(20, 10, 0, 0.75);
            border: 1px solid rgba(243, 156, 18, 0.6);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 100;
            animation: pass-toast 2.2s ease forwards;
        }

        @keyframes pass-toast {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px) scale(0.9);
            }
            12% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            75% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px) scale(0.95);
            }
        }

        .cards-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* ---------- Cards ---------- */

        .card {
            width: 62px;
            height: 88px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fdfdfb;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            font-family: Georgia, "Times New Roman", serif;
            color: #1c1c1c;
            user-select: none;
            transition: transform 0.12s, box-shadow 0.12s;
        }

        .card .card-rank {
            font-size: 24px;
            font-weight: bold;
            line-height: 1;
        }

        .card .card-suit {
            font-size: 28px;
            line-height: 1.15;
        }

        .card.red {
            color: #c0392b;
        }

        .card.back {
            background: repeating-linear-gradient(45deg,
                    #2c5f8a 0px, #2c5f8a 6px,
                    #1f4668 6px, #1f4668 12px);
            border: 3px solid #fdfdfb;
        }

        .card.back::after {
            content: "🂠";
            font-size: 30px;
            color: rgba(255, 255, 255, 0.55);
        }

        .card.faded {
            opacity: 0.45;
        }

        /* ---------- Game over banner ---------- */

        #game-over {
            max-width: 900px;
            margin: 0 auto 10px;
            padding: 14px 20px;
            border-radius: 12px;
            text-align: center;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(241, 196, 15, 0.5);
        }

        #game-over h2 {
            margin: 0 0 6px;
            color: #f1c40f;
        }

        #game-over .placements {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        #game-over .placement {
            padding: 4px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            font-weight: 600;
        }

        #game-over .placement.you {
            border: 1px solid #7dffa8;
            color: #7dffa8;
        }

        #game-over .round-history {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #game-over .round-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85em;
        }

        #game-over .round-label {
            font-weight: 700;
            color: rgba(241, 196, 15, 0.8);
            min-width: 28px;
        }

        #game-over .round-item {
            padding: 1px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
        }

        #game-over .round-item.you {
            color: #7dffa8;
            border: 1px solid rgba(125, 255, 168, 0.4);
        }

        #game-over .game-over-actions {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #game-over .game-over-actions button {
            min-width: 140px;
        }

        /* ---------- Cleared-pile notice ---------- */

        #cleared-notice {
            max-width: 900px;
            margin: 0 auto 10px;
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            color: #7dffa8;
            background: rgba(125, 255, 168, 0.12);
            border: 1px solid rgba(125, 255, 168, 0.4);
        }

        .card.clickable {
            cursor: pointer;
        }

        .card.clickable:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.5);
        }

        /* Selected must win over hover (same specificity + later rule) */
        .card.clickable.selected {
            transform: translateY(-14px);
            box-shadow: 0 0 0 3px #f1c40f, 0 10px 16px rgba(0, 0, 0, 0.5);
        }

        /* Opponent hands: smaller cards */

        .opponent-hand .card {
            width: 44px;
            height: 62px;
            border-radius: 6px;
        }

        .opponent-hand .card .card-rank {
            font-size: 16px;
        }

        .opponent-hand .card .card-suit {
            font-size: 19px;
        }

        .opponent-hand .card.back::after {
            font-size: 20px;
        }

        /* Compact opponent representation (small screens): the hand row
           is just the header with a card count - no card backs. */
        .opponent-hand.compact {
            padding: 6px 10px;
        }

        .opponent-hand.compact h3 {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .opponent-hand.compact .card-count {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
            padding: 2px 10px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.9em;
            color: #f1c40f;
            background: rgba(241, 196, 15, 0.15);
            border: 1px solid rgba(241, 196, 15, 0.5);
        }

        .opponent-hand.compact .card-count::before {
            content: '🂠';
            font-size: 0.95em;
            opacity: 0.9;
        }

        /* ---------- Responsive: phones ---------- */

        /* Small screens (phones): compact layout; hands scroll
           horizontally when they don't fit (no overlapping cards). */
        @media (max-width: 640px) {
            header {
                padding: 8px 12px;
            }

            header h1 {
                font-size: 1.1em;
            }

            #player-turn {
                font-size: 0.9em;
            }

            #table {
                min-height: 120px;
                margin: 12px 8px 6px;
                padding: 10px;
            }

            .card {
                width: 48px;
                height: 68px;
            }

            .card .card-rank {
                font-size: 18px;
            }

            .card .card-suit {
                font-size: 21px;
            }

            .opponent-hand .card {
                width: 34px;
                height: 48px;
            }

            .opponent-hand .card .card-rank {
                font-size: 12px;
            }

            .opponent-hand .card .card-suit {
                font-size: 14px;
            }

            .opponent-hand .card.back::after {
                font-size: 14px;
            }

            .hand {
                padding: 8px;
            }

            .cards-row {
                /* Cards wrap onto multiple rows so the whole hand is
                   visible at once (no scrolling). */
                flex-wrap: wrap;
            }

            #controls {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                margin: 8px auto 16px;
                padding: 0 8px;
            }

            .btn-group {
                justify-content: center;
            }

            .btn-group.main-actions {
                gap: 12px;
            }

            .btn-group.main-actions button {
                min-width: 0;
                flex: 1;
                padding: 14px 12px;
            }

            /* Game-over buttons: side by side, equal width, comfortable
               touch targets. */
            #game-over .game-over-actions button {
                flex: 1;
                min-width: 0;
                padding: 14px 12px;
            }

            #hands-container {
                padding: 0 8px 20px;
            }

            .hand h3 {
                font-size: 0.75em;
            }

            .pass-toast {
                font-size: 0.9em;
                bottom: 40%;
            }
        }

        /* Landscape phones: keep everything on one screen */
        @media (max-height: 500px) and (orientation: landscape) {
            header {
                padding: 4px 12px;
            }

            #table {
                min-height: 80px;
                margin: 6px 8px 4px;
                padding: 6px;
            }

            .card {
                width: 40px;
                height: 56px;
            }

            .card .card-rank {
                font-size: 15px;
            }

            .card .card-suit {
                font-size: 17px;
            }

            .opponent-hand .card {
                width: 28px;
                height: 40px;
            }

            .opponent-hand .card .card-rank {
                font-size: 10px;
            }

            .opponent-hand .card .card-suit {
                font-size: 12px;
            }

            .opponent-hand .card.back::after {
                font-size: 12px;
            }

            .hand {
                margin: 6px 0;
                padding: 6px;
            }

            .cards-row {
                flex-wrap: wrap;
            }

            #controls {
                margin: 4px auto 10px;
                padding: 0 10px;
                gap: 8px;
            }

            .btn-group.main-actions button {
                padding: 10px 16px;
            }

            #hands-container {
                padding: 0 10px 12px;
            }
        }
        /* ---------- Round log (bottom-right) ---------- */

        .log-toggle {
            position: fixed;
            right: calc(16px + env(safe-area-inset-right));
            bottom: calc(16px + env(safe-area-inset-bottom));
            z-index: 60;
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 0.95em;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: inherit;
            cursor: pointer;
        }

        .log-toggle:hover {
            background: rgba(0, 0, 0, 0.6);
        }

        .log-panel {
            position: fixed;
            right: calc(16px + env(safe-area-inset-right));
            bottom: calc(64px + env(safe-area-inset-bottom));
            z-index: 60;
            width: min(340px, calc(100vw - 32px));
            max-height: min(55vh, 480px);
            overflow-y: auto;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(18, 22, 30, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .log-panel h3 {
            margin: 0 0 10px;
            font-size: 1em;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .log-entry {
            display: flex;
            gap: 8px;
            align-items: baseline;
            padding: 4px 0;
            font-size: 0.92em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry .who {
            font-weight: 600;
            white-space: nowrap;
        }

        .log-entry .what {
            opacity: 0.85;
            word-break: break-word;
        }

        .log-entry.bomb .who,
        .log-entry.bomb .what {
            color: #ff9d6f;
        }

        .log-entry .mini-cards {
            display: inline-flex;
            gap: 3px;
            margin-left: 2px;
            vertical-align: middle;
        }

        .log-entry .mini-card {
            display: inline-block;
            min-width: 20px;
            padding: 1px 3px;
            border-radius: 4px;
            font-size: 0.85em;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            color: #1a1a1a;
        }

        .log-entry .mini-card.red {
            color: #c0392b;
        }

        .log-empty {
            opacity: 0.5;
            font-size: 0.9em;
            padding: 8px 0;
        }

        @media (max-width: 640px) {
            .log-toggle {
                right: calc(10px + env(safe-area-inset-right));
                bottom: calc(10px + env(safe-area-inset-bottom));
                padding: 8px 14px;
            }

            .log-panel {
                right: calc(10px + env(safe-area-inset-right));
                bottom: calc(56px + env(safe-area-inset-bottom));
                width: calc(100vw - 20px);
                max-height: 50vh;
            }
        }
    </style>
</head>

<body>
    <div id="connection-status" class="connection-status" hidden>
        Connection lost — reconnecting...
    </div>
    <header>
        <h1>♠ Tiến Lên</h1>
        <div id="status">
            <span id="spectator-badge" class="spectator-badge" hidden>Spectating</span>
            <h2 id="player-turn"></h2>
        </div>
    </header>

    <main>
        <section id="table">
            <div id="cards-in-play-container"></div>
        </section>

        <section id="game-over" hidden></section>

        <section id="cleared-notice" hidden></section>

        <section id="controls">
            <div class="btn-group main-actions" style="display: none;">
                <button id="pass-btn" onclick="sendPass()">Pass</button>
                <button class="primary" id="place-btn" onclick="sendDataBack()">Place</button>
            </div>
            <div class="controls-row">
                <div class="btn-group" id="new-game-group">
                    <button id="new-game-btn" onclick="sendNewGame()">Start game</button>
                </div>
                <div class="btn-group" id="sort-actions" style="display: none;">
                    <button onclick="sortHand(1)">Sort ↑</button>
                    <button onclick="sortHand(-1)">Sort ↓</button>
                </div>
            </div>
        </section>
    </main>

    <section id="hands-container"></section>

    <button id="log-toggle" class="log-toggle" hidden onclick="toggleLog()">📜 Log</button>
    <div id="log-panel" class="log-panel" hidden></div>

    <script src="client.js"></script>
</body>

</html>
