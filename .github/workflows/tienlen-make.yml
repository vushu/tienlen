name: SWI-Prolog CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install SWI-Prolog
      run: |
        # Use the official SWI-Prolog PPA for a recent stable version
        sudo apt-add-repository ppa:swi-prolog/stable -y
        sudo apt-get update
        sudo apt-get install -y swi-prolog

    - name: Run Tests
      run: |
        make test