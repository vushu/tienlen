<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tiến Lên ADMIN app icon: spade with a shield badge, on darker felt -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1a2f42"/>
      <stop offset="60%" stop-color="#0f1f30"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#felt)"/>
  <!-- the spade, slightly smaller and shifted up to make room for the badge -->
  <path d="M256 76
           C 220 130, 142 176, 142 248
           a 58 58 0 0 0 98 42
           l -16 60
           h 64
           l -16 -60
           a 58 58 0 0 0 98 -42
           C 370 176, 292 130, 256 76 Z"
        fill="#ecf0f1"/>
  <!-- admin shield badge, bottom right -->
  <g transform="translate(322, 322) scale(1.15)">
    <path d="M64 8
             L 112 26
             V 64
             C 112 96, 90 116, 64 126
               38 116, 16 96, 16 64
             V 26 Z"
          fill="#f1c40f" stroke="#0a1520" stroke-width="8"/>
    <!-- gear-ish center: a simple wrench mark -->
    <path d="M64 40
             a 14 14 0 1 1 -0.1 0 Z
             M 58 52
             L 46 84
             h 36
             L 70 52 Z"
          fill="#0a1520"/>
  </g>
</svg>
