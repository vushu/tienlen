      <stop offset="60%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0c3a1e"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#felt)"/>
  <!-- the spade -->
